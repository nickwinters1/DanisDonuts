<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dani's Donuts · For HeyDani, with love</title>
    <meta name="description" content="A love letter to HeyDani from her community, Dani's Donuts. Leave a message, find the hidden crystals, play Donut Drop, and make a wish." />
    <meta name="theme-color" content="#1b0f3d" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dani's Donuts · For HeyDani, with love" />
    <meta property="og:description" content="Every message is a one-of-a-kind holographic donut card. Come bake one for Dani." />
    <meta property="og:image" content="./og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* First paint, before any CSS/JS arrives: the twilight sky + a spinning donut. */
      html { background: #0b051d; }
      body { margin: 0; }
      .prepaint { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(60% 50% at 50% 110%, rgba(255,122,133,.55), transparent 70%), linear-gradient(180deg,#0b051d,#1b0f3d 60%,#3b1a63); }
      .prepaint svg { width: 110px; animation: pp 2s linear infinite; }
      @keyframes pp { to { transform: rotate(360deg); } }
      body:has(.boot) .prepaint, html.view-stream .prepaint, html.view-overlay .prepaint, html.view-admin .prepaint { display: none; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#wall">Skip to the messages</a>
    <div class="prepaint" aria-hidden="true">
      <svg viewBox="-50 -50 100 100"><path d="M-45,0a45,45 0 1,0 90,0a45,45 0 1,0 -90,0ZM-12.5,0a12.5,12.5 0 1,1 25,0a12.5,12.5 0 1,1 -25,0Z" fill="#e2a35f" fill-rule="evenodd"/><path d="M-38,0a38,38 0 1,0 76,0a38,38 0 1,0 -76,0ZM-19,0a19,19 0 1,1 38,0a19,19 0 1,1 -38,0Z" fill="#ff8fc7" fill-rule="evenodd"/></svg>
    </div>
    <noscript>
      <p style="font-family: system-ui; color: #fff; text-align: center; padding: 40px">Dani's Donuts needs JavaScript to bake. Please enable it 🍩</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
